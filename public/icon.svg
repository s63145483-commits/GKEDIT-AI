<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="70%" stop-color="#040b18" />
      <stop offset="100%" stop-color="#020713" />
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />

  <!-- Outer HUD Circular Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Arc Segments (Iron Man Arc Reactor Style) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#arcGrad)" stroke-width="8" stroke-dasharray="120 30 70 30" stroke-linecap="round" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="40 20" opacity="0.8" />
  </g>

  <!-- Triangular Arc Notches -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="96" x2="256" y2="124" />
    <line x1="256" y1="388" x2="256" y2="416" />
    <line x1="96" y1="256" x2="124" y2="256" />
    <line x1="388" y1="256" x2="416" y2="256" />
    <line x1="143" y1="143" x2="163" y2="163" />
    <line x1="369" y1="369" x2="349" y2="349" />
    <line x1="143" y1="369" x2="163" y2="349" />
    <line x1="369" y1="143" x2="349" y2="163" />
  </g>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="82" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.95" />
  <circle cx="256" cy="256" r="70" fill="#030c1d" />

  <!-- Center Monogram "J" / "GK" -->
  <text x="256" y="278" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    GK
  </text>
  <text x="256" y="302" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
    JARVIS
  </text>
</svg>
